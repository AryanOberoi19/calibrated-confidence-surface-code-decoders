[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qeccal"
version = "0.0.1"
description = "Calibrated confidence and certified abort thresholds for surface-code decoders on Google's Willow data"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
